name: Quality and security checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/bepa
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/bepa
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://your-project-ref.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: your-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run security:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

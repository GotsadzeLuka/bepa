name: Quality and security checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bepa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bepa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/bepa
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/bepa
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Create disposable PostgreSQL schema
        run: npx prisma db push
      - name: Apply database invariants
        run: npm run db:constraints
      - name: Execute real PostgreSQL concurrency and rollback tests
        run: npm run test:integration
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/bepa
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/bepa
      NEXT_PUBLIC_APP_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://your-project-ref.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: your-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run security:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
